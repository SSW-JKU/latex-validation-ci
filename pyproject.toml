[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
# explicit search path due to custom "action_tests" folder
[tool.setuptools.packages.find]
include = ["latex_validation_action"]

[project]
name = "latex-validation-action"
version = "0.0.1"
description = "LaTeX linting and spellchecking GitHub Action for CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "filelock>=4.2.10",
  "gh-action-integration-test",
  "pygithub>=2.10.0",
  "requests>=2.34.2",
]

[dependency-groups]
dev = [
  "check-dependencies>=2.0.1",
  "mypy==1.15.0",
  "pre-commit>=4.6.2",
  # TODO: re-enable those again
  # "pytest==9.0.3",
  "pytest-cov==7.1.0",
  # "pytest-mock==3.15.1",
  "ruff==0.16.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["latex_validation_action", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing-comma rule: conflicts with the formatter
  "ISC001", # implicit string concat: conflicts with the formatter
  "D203",   # 1 blank line before class docstring (conflicts with D211)
  "D213",   # multi-line docstring summary on second line (conflicts with D212)
  "CPY001", # don't require copyright notice
  # TODO: Fix these findings and remove the ignores one by one (282 findings across 4 files at the time of writing)
  "A001",    # builtin shadowing (variable)
  "A002",    # builtin shadowing (argument)
  "ANN001",  # missing argument type annotation
  "ANN201",  # missing return type (public function)
  "ANN204",  # missing return type (special method)
  "ARG002",  # unused function argument
  "D100",    # missing module docstring
  "D101",    # missing class docstring
  "D102",    # missing method docstring
  "D103",    # missing function docstring
  "D104",    # missing package docstring
  "D105",    # missing magic method docstring
  "D107",    # missing __init__ docstring
  "D205",    # blank line after docstring summary
  "D400",    # first line should end with a period
  "D401",    # imperative mood
  "D414",    # empty docstring section
  "D415",    # first line should end with punctuation
  "E501",    # line too long
  "EM101",   # string literal in exception
  "EM102",   # f-string in exception
  "ERA001",  # commented-out code
  "EXE001",  # shebang but not executable
  "FBT001",  # boolean positional argument
  "FBT002",  # boolean default positional argument
  "FIX002",  # TODO in code
  "FURB171", # single-item membership test
  "G004",    # f-string in logging
  "LOG015",  # call on root logger
  "N806",    # non-lowercase variable in function
  "N999",    # invalid module name
  "PERF401", # use list.extend
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR0917", # too many positional arguments
  "PLR2004", # magic value in comparison
  "PLW0603", # global statement
  "PTH100",  # os.path.abspath
  "PTH103",  # os.makedirs
  "PTH118",  # os.path.join
  "PTH123",  # open()
  "RET503",  # missing explicit return
  "S108",    # insecure /tmp usage
  "S113",    # requests without timeout
  "S602",    # subprocess with shell=True
  "SIM108",  # use ternary operator
  "SIM117",  # combine nested with statements
  "T201",    # print found
  "TD002",   # TODO missing author
  "TD003",   # TODO missing issue link
  "TRY003",  # long exception message
  "TRY300",  # return in try block
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D",       # docstring rules: tests don't need docstrings
  "PLR2004", # magic-value-comparison: tests often use magic values
  "S101",    # assert: allow assertions in tests (rewritten by pytest)
]
"action_tests/*" = [
  "D",
  "PLR2004",
  "S101",
  "T201",    # allow print statements in action tests
]

[tool.ruff.lint.isort]
known-first-party = ["latex_validation_action"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
pretty = true
warn_unreachable = true
check_untyped_defs = true
enable_error_code = ["ignore-without-code"]
packages = ["latex_validation_action", "tests", "action_tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=gh_action_integration_test",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["pragma: no cover"]
fail_under = 95

[tool.check-dependencies]
# tooling dependencies
known-extra = ["check-dependencies", "mypy", "pre-commit", "pytest-cov", "ruff"]
# dependencies referred to via absolute imports
known-missing = []

[tool.check-dependencies.provides]
# package alias
beautifulsoup4 = "bs4"
PyGithub = "github"

[tool.uv.sources]
gh-action-integration-test = { git = "https://github.com/skloibi/gh-action-integration-test.git" }
